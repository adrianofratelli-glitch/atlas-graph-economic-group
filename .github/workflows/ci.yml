name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: python -m compileall -q backend tests scripts data-generator queries
      # Offline suite (mocked MongoDB). The live_*, http_adversarial, stress and
      # browser-*.cjs scripts need Atlas or a running API and are not discovered here.
      - run: python -m unittest discover -s tests -p 'test_*.py'

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: node --test tests/*.test.mjs

  # Mesma pergunta em dois motores reais (sem segredo, sem Atlas): a agregação da
  # POV e a consulta recursiva precisam devolver o mesmo grupo em todas as
  # células. Os tempos daqui não são publicados; a fotografia da página sai da
  # rodada local documentada em docs/comparison-protocol.md.
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Informativo até o primeiro verde no GitHub (services e imagens ainda não
    # validados lá); depois, retirar para virar gate.
    continue-on-error: true
    services:
      mongo:
        image: mongo:8.2
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 5s --health-timeout 5s --health-retries 20
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust  # container descartável do job
          POSTGRES_DB: graph_compare_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      # Sem pgserver: aqui o PostgreSQL é o service container.
      - run: pip install -r backend/requirements.txt "psycopg[binary]>=3.2"
      - run: >-
          python queries/compare_postgres.py --runs 20 --concurrency 1 --background 5000
          --mongo-uri "mongodb://127.0.0.1:27017/?directConnection=true"
          --pg-uri "postgresql://postgres@127.0.0.1:5432/graph_compare_test"
          --out /tmp/comparison-ci.json
